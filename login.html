<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — LeadSap</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .auth-card { background: #fff; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  .auth-card h1 { margin: 0 0 8px; font-size: 28px; color: #1a1a2e; }
  .auth-card p.sub { color: #666; margin: 0 0 24px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #333; }
  .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
  .form-group input:focus { outline: none; border-color: #667eea; }
  .btn-primary { width: 100%; padding: 13px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .btn-primary:hover { opacity: 0.9; }
  .auth-footer { text-align: center; margin-top: 20px; color: #666; font-size: 14px; }
  .auth-footer a { color: #667eea; text-decoration: none; font-weight: 500; }
  .error { background: #fee; color: #c00; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="auth-card">
  <h1>С возвращением 👋</h1>
  <p class="sub">Войдите, чтобы продолжить работу с LeadSap</p>
  <div id="error" class="error"></div>
  <form id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="btn-primary">Войти</button>
  </form>
  <div class="auth-footer">
    Нет аккаунта? <a href="register.html">Зарегистрироваться</a><br>
    <a href="index.html">← На главную</a>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  errorEl.classList.remove('show');
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка входа');
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.add('show');
  }
});
</script>
</body>
</html>
